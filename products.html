
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Products | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>

    <header class="page-header">
        <nav class="navbar">
            <h2 class="brand">ShopEase</h2>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="cart.html">Cart</a>
                <a href="login.html">Login</a>
                <a href="orders.html">My Orders</a>
            </div>
        </nav>
    </header>

    <main class="products-page">

        <section class="products-heading">
            <p class="hero-tagline">FIND WHAT YOU LOVE</p>
            <h1>Explore Our Products</h1>
            <p>Discover products that make your everyday life better.</p>
        </section>

        <section class="product-controls">
            <input
                type="text"
                id="searchInput"
                placeholder="Search by product name or ID"
            >

            <select id="categoryFilter">
                <option value="all">All Categories</option>
            </select>
        </section>

        <p id="productMessage"></p>

        <section id="productList" class="product-container">
        </section>

        <section class="pagination">
            <button id="previousPage">← Previous</button>
            <span id="pageNumber">1</span>
            <button id="nextPage">Next →</button>
        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script type="module" src="js/products.js"></script>

</body>
</html>
