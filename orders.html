
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Orders - Ecommerce</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>My Orders</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="products.html">Products</a>
            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <main>
        <h2>Order History</h2>

        <p id="orderMessage"></p>

        <table border="1" cellpadding="10">
            <thead>
                <tr>
                    <th>Order ID</th>
                    <th>Date</th>
                    <th>Total</th>
                    <th>Payment Method</th>
                    <th>Payment Status</th>
                    <th>Order Status</th>
                    <th>Bill</th>
                </tr>
            </thead>

            <tbody id="ordersList"></tbody>
        </table>

        <section id="billSection">
            <h2>Order Bill</h2>
            <div id="billDetails"></div>
            <button id="printBillBtn" onclick="window.print()">
                Print Bill
            </button>
        </section>
    </main>

    <script type="module" src="js/orders.js"></script>

</body>
</html>
