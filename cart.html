
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Cart | ShopEase</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header class="page-header">
        <nav class="navbar">
            <h2 class="brand">ShopEase</h2>
            <div class="nav-links">
                <a href="index.html">Home</a>
                <a href="products.html">Products</a>
                <a href="orders.html">My Orders</a>
                <a href="login.html">Login</a>
            </div>
        </nav>
    </header>

    <main class="cart-page">

        <section class="cart-heading">
            <p class="hero-tagline">ALMOST YOURS!</p>
            <h1>Your Shopping Cart</h1>
            <p>Review your items before placing your order.</p>
        </section>

        <section class="cart-content">

            <p id="cartMessage"></p>

            <div class="cart-table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Product</th>
                            <th>Price</th>
                            <th>Quantity</th>
                            <th>Subtotal</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody id="cartList"></tbody>
                </table>
            </div>

            <div class="cart-summary">
                <h2>Order Summary</h2>
                <h3 id="cartTotal">Total: ₹0</h3>

                <div class="cart-buttons">
                    <button id="clearCartBtn" class="clear-btn">
                        Clear Cart
                    </button>

                    <button id="checkoutBtn" class="primary-btn">
                        Proceed to Checkout →
                    </button>
                </div>

                <a href="products.html" class="continue-link">
                    ← Continue Shopping
                </a>
            </div>

        </section>

    </main>

    <footer class="site-footer">
        <p>© 2026 ShopEase. All Rights Reserved.</p>
    </footer>

    <script type="module" src="js/cart.js"></script>

</body>
</html>
